name: Set up client build
description: Linux system deps, Node, Rust (+ cache), npm install, and the app version when one is given
inputs:
  cache-key:
    description: Rust cache key suffix, one per platform
    required: false
    default: ''
  version:
    description: App version written into tauri.conf.json, e.g. 1.2.0 (empty keeps the committed one)
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Restores the installed packages from the cache instead of an apt-get update + install.
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
        version: 1

    - name: Set app version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        node -e "
          const fs = require('fs');
          const path = 'apps/client/src-tauri/tauri.conf.json';
          const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
          conf.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
        "

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    # A cache saved by a tag run can only be restored by that same tag, so tags don't save one:
    # they restore what build-client.yml saved on master. The shared key is what lets the two
    # workflows read each other's cache.
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/client/src-tauri -> target
        shared-key: client-${{ inputs.cache-key }}
        cache-on-failure: true
        save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    # The bundler tools Tauri downloads on first use: NSIS on Windows, linuxdeploy and the
    # AppImage plugins on Linux.
    - name: Cache Tauri bundler tools
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/tauri
          ~/AppData/Local/tauri
        key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: tauri-tools-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
