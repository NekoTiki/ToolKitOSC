name: Build client

on:
  push:
    branches: [main]
    paths:
      - apps/client/**
      - packages/shared-ui/**
      - package.json
      - package-lock.json
      - .github/workflows/build-client.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The client only ships a Windows (nsis) bundle today — see apps/client/src-tauri/tauri.conf.json.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build client
        run: npm run build -w apps/client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vrc-osc-toolkit-client-windows
          path: |
            apps/client/src-tauri/target/release/bundle/**
            apps/client/src-tauri/target/release/*.exe
          if-no-files-found: error
