[package]
name = "toolkitosc"
version = "1.0.0"
description = "ToolKitOSC desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "toolkitosc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
vrchat_osc = "2"
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Dynamically loads openvr_api.dll at runtime (see src/steamvr.rs) - avoids the CMake + bindgen/
# libclang build-time toolchain the community openvr/openvr_sys crates require.
libloading = "0.9"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

# The Stop everything hotkey (see src/composables/useStopEverything.ts), registered from the UI.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Creates the .lnk shortcut VRCX's own "Launch with VRChat" folder watches (see src/vrcx.rs).
mslnk = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
