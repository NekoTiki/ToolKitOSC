[package]
name = "toolkitosc"
version = "1.0.0"
description = "ToolKitOSC desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "toolkitosc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
vrchat_osc = "2"
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Dynamically loads openvr_api.dll at runtime (see src/steamvr.rs) - avoids the CMake + bindgen/
# libclang build-time toolchain the community openvr/openvr_sys crates require.
libloading = "0.9"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
# ESP32 boards (see src/boards): mDNS browsing for _tkosc._tcp, and the plain ws:// link to each.
# TLS is for the share server's wss:// link (see src/server), on rustls so Linux needs no OpenSSL.
mdns-sd = "0.21"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# OpenShock's REST API (see src/openshock). Same reqwest and TLS setup the updater already pulls in.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# The TLS crypto that reqwest's rustls-no-provider expects installed (see lib.rs). ring is the one
# tokio-tungstenite already brings.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Reads the signed-in user out of the share server's JWT (see src/server/auth.rs).
base64 = "0.22"
# The intensity and duration a shock rolls (see src/openshock).
rand = "0.9"
# Tokens in the system's password store (see src/secrets.rs): Windows Credential Manager, or the
# Secret Service on Linux over zbus, so there's no libdbus to build against.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

# The Stop everything hotkey (see src/composables/useStopEverything.ts), registered from the UI.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Creates the .lnk shortcut VRCX's own "Launch with VRChat" folder watches (see src/vrcx.rs).
mslnk = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
