# Reference compose file for running the server image published to GitHub Container Registry.
#
#   docker compose -f apps/server/docker-compose.yml pull
#   docker compose -f apps/server/docker-compose.yml up -d
#
# To build the image locally instead, uncomment the build section below and run
# `docker compose -f apps/server/docker-compose.yml up -d --build` from the repo root.
# build.context points at the repo root (two levels up) because this app depends on
# the packages/shared-ui workspace package — see apps/server/Dockerfile.
services:
  app:
    image: ghcr.io/nekotiki/toolkitosc-server:latest
    # build:
    #   context: ../..
    #   dockerfile: apps/server/Dockerfile
    restart: always
    container_name: toolkitosc-server
    env_file:
      - .env
    ports:
      - '3131:3000'
    volumes:
      - ./data:/app/data
